name: Package writing marketplace plugin

on:
  push:
    branches:
      - main
    paths:
      - skills/writing/**
      - scripts/package-writing-plugin.sh
      - .github/workflows/package-writing-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package canonical writing skills
        run: bash scripts/package-writing-plugin.sh

      - name: Commit generated package when needed
        run: |
          if git diff --quiet -- plugins/writing/skills; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/writing/skills
          git commit -m "chore: package writing marketplace skills"
          git push
