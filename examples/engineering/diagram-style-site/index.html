<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagram styling</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f2f2f0;color:#17232e;font:15px/1.5 Arial,Helvetica,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:28px;font-weight:600;margin:0 0 8px}p{margin:0 0 24px;color:#50606d}header{margin-bottom:24px}.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;padding:20px 0;border-top:1px solid #c9cdd0;border-bottom:1px solid #c9cdd0}label{display:flex;flex-direction:column;gap:6px;font-size:13px}input,select,button{font:inherit}input[type=color]{width:60px;height:36px;padding:3px;border:1px solid #89949e;border-radius:4px;background:transparent}input[type=range]{width:120px;min-height:32px}select,button{padding:8px 12px;border:1px solid #89949e;border-radius:4px;background:#fff;color:#17232e}button:disabled{opacity:.45}button{cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.check{flex-direction:row;align-items:center;padding-bottom:8px}section{margin:28px 0}h2{font-size:13px;letter-spacing:1.2px;font-weight:600}.canvas{overflow-x:auto}svg{display:block;width:100%;min-width:960px;height:auto}#status{min-height:24px;font-size:13px;margin:12px 0;color:#354b5e}#status[data-invalid=true]{color:#972c24}details{margin-top:24px}summary{cursor:pointer}pre{white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace}.note{font-size:13px}a{color:#23618b}:focus-visible{outline:3px solid #23618b;outline-offset:3px}@media(max-width:600px){body{padding:16px}.controls{gap:16px}button,select{min-height:44px}}
</style></head><body><main>
<header><h1 id="profile-name">Diagram styling</h1><p><span id="profile-notes"></span> The same diagram in both themes.</p></header>
<div class="controls">
<label>Palette<select id="palette"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label>Canvas<input id="paper" type="color" aria-label="Canvas color"></label>
<label>Accent<input id="accent" type="color" aria-label="Accent color"></label>
<label>Accent fill<input id="accent-tint" type="color" aria-label="Accent fill color"></label>
<label>Node corners <output id="radius-value">6px</output><input id="radius" type="range" min="0" max="8" step="1" value="6"></label>
<label>Headings<select id="headings"><option value="clean">Clean sans</option><option value="handwritten">Handwritten</option></select></label>
<label class="check"><input id="compare" type="checkbox" checked>Compare both</label>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div class="actions"><button id="save-profile" type="button">Save style profile</button><button id="save-light" type="button">Export light SVG</button><button id="save-dark" type="button">Export dark SVG</button><button id="reset" type="button">Reset</button></div>
<section id="light-panel"><h2>LIGHT</h2><div class="canvas" id="light-canvas"></div></section>
<section id="dark-panel"><h2>DARK</h2><div class="canvas" id="dark-canvas"></div></section>
<p class="note">Changes stay in this page until you save a profile. Handwritten headings use an installed system font, with a cursive fallback. This example illustrates task routing.</p>
<details><summary>Current profile</summary><pre id="profile-text"></pre></details>
</main>
<script id="style-data" type="application/json">{"profile": "\u003c!-- diagram-design-profile\nname: andrewmccall.com\nslug: andrewmccall-site\nsource-url: https://andrewmccall.com\ncreated: 2026-11-14\nupdated: 2026-11-14\nnotes: Site palette and type for diagrams published on andrewmccall.com; dark is primary\n--\u003e\n# Style Guide\n\nUse with Cathryn Lavery's `diagram-design` for diagrams published on\nandrewmccall.com. This profile changes the visual skin; use that skill's type\nreferences, complexity limits, connector routing and checks. Dark is the primary\ntheme because the site is dark. The light theme serves the same diagram in light\ncontexts such as documents and slides.\n\n## Tokens\n\n### Semantic roles\n\n| Role | Purpose | Light | Dark |\n|---|---|---|---|\n| `paper` | Canvas | `#f5f5f5` | `#101312` |\n| `paper-2` | Quiet grouping and secondary nodes | `#ececec` | `#151918` |\n| `ink` | Primary text | `#2d3142` | `#e7e9e3` |\n| `ink-strong` | Text on opaque accent fill | `#ffffff` | `#101312` |\n| `muted` | Secondary text and essential connectors | `#4f5d75` | `#9ba59f` |\n| `soft` | Small labels | `#5a6580` | `#87928c` |\n| `rule` | Decorative dividers | `#dddde0` | `#303632` |\n| `rule-solid` | Decorative group boundaries | `#bfc0c0` | `#4a524d` |\n| `accent` | One focal node or path | `#17704a` | `#9cffcb` |\n| `accent-tint` | Quiet focal fill | `#e3eae7` | `#1e2b24` |\n| `link` | External call or protocol label | `#17704a` | `#9cffcb` |\n\n### Palette sources\n\nThe dark palette is the site stylesheet, so a diagram sits on a page without a\nvisible frame. `--bg`, `--rail`, `--text`, `--muted`, `--line` and `--accent` map\nto `paper`, `paper-2`, `ink`, `muted`, `rule` and `accent`. The site's `--faint`\n(`#737e78`) is below 4.5:1 for small labels, so `soft` lightens it within the same\nhue. `accent-tint` is the accent at 10% over `paper`.\n\nThe light palette keeps the upstream diagram-design neutrals and takes a deep\ngreen from the site accent's hue, so both themes share one accent. The site has a\nsingle accent, so `link` uses it too; distinguish external calls with labels and\nline treatment rather than hue.\n\n### Chart series\n\n| Token | Light | Dark | Use |\n|---|---|---|---|\n| `series-1` | `#4f7686` | `#7fa8b8` | Mist blue, first non-focal series |\n| `series-2` | `#85733f` | `#c3b38a` | Sand |\n| `series-3` | `#6d5f93` | `#a99cc6` | Lilac |\n| `series-4` | `#96594a` | `#c99282` | Clay |\n| `series-5` | `#5b7266` | `#8fa69a` | Sage grey |\n\nThe series are desaturated so the mint accent stays the only bright colour; use\nthe accent for the one highlighted series. Each clears 3:1 against `paper` and\n`paper-2` in its theme. Label series directly rather than relying on hue alone.\n\n### Contrast contract\n\nText using `ink`, `muted`, `soft`, `link` or `accent` clears 4.5:1 against\n`paper`, `paper-2` and `accent-tint`. Essential connectors and node borders use\n`muted` or `accent` at full opacity and clear 3:1 against their adjacent surfaces.\n`ink-strong` is used only on an opaque `accent` fill. Decorative rules cannot be\nthe only way a reader identifies a boundary. Theme changes preserve topology,\nwording, role meanings and geometry.\n\n## Typography\n\n| Role | Family | Size | Weight | Usage |\n|---|---|---|---|---|\n| `title` | Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif | 32px | 680 | Headline, tracked -0.04em like site headings |\n| `node-name` | Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif | 18px | 620 | Component names, like site entry titles |\n| `sublabel` | ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace | 12px | 400 | API and storage details |\n| `eyebrow` | ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace | 11px | 500 | Uppercase, tracked 0.1em, like site section labels |\n| `arrow-label` | ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace | 11px | 400 | Short connector labels |\n| `callout` | Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif | 16px | 400 | One supporting sentence in `muted` |\n\n### Font source\n\nFont source: `system`\n\nThese are the site's own stacks. The site does not load a web font, so Inter\nrenders where installed and otherwise falls back to the platform sans, matching\nwhat readers see on the page. Use no serif or italic. Check the rendered font\nmetrics before exporting.\n\n## Stroke, radius, spacing\n\n| Token | Value | Use |\n|---|---|---|\n| `stroke-thin` | `1` | Decorative boundaries |\n| `stroke-default` | `1.25` | Essential connectors and node borders |\n| `stroke-strong` | `1.75` | Focal outline |\n| `radius-sm` | `4` | Small labels |\n| `radius-md` | `6` | Nodes |\n| `radius-lg` | `8` | Groups, matching site cards |\n| `grid` | `4` | Structural geometry |\n\nRounded orthogonal connectors follow the upstream routing rules. Keep 6\u201310px\nclear between an arrow label and its stroke. Use generous gutters and align\nrelated components to a shared axis.\n\n## Node type \u2192 treatment\n\n| Type | Fill | Stroke |\n|---|---|---|\n| `focal` | `accent-tint` | `accent`, stroke-strong |\n| `backend` | `paper` | `muted` |\n| `store` | `paper-2` | `muted` |\n| `external` | `paper` | `rule-solid` |\n| `input` | `paper` | `muted` |\n| `optional` | `paper` | `muted`, dashed 4,4 |\n| `security` | `paper` | `muted`, dashed 4,4 and an explicit boundary label |\n\nReserve the accent for one or two focal elements, as the site reserves it for\nlinks and the current page. Default to plain paper, with no dots, gradients,\nshadows, glow or decorative icons.\n\n## Customizing the skin\n\nEdit semantic roles to change color; edit typography and stroke tables to change\nthe visual treatment. Regenerate and inspect both themes after a change. When the\nsite stylesheet changes, update the dark palette from it and recheck contrast.\nKeep this profile outside an installed upstream skill so updates cannot replace\nit. For named-profile installation, follow the current upstream `profiles.md`\nprocedures.\n\n## Visual references\n\n- [andrewmccall.com](https://andrewmccall.com): palette, type stacks, heading weight, uppercase mono labels and card radius.\n- [Diagram Design](https://github.com/cathrynlavery/diagram-design): retained diagram engine, type selection and layout checks.\n", "palettes": {"light": {"paper": "#f5f5f5", "paper-2": "#ececec", "ink": "#2d3142", "ink-strong": "#ffffff", "muted": "#4f5d75", "soft": "#5a6580", "rule": "#dddde0", "rule-solid": "#bfc0c0", "accent": "#17704a", "accent-tint": "#e3eae7", "link": "#17704a"}, "dark": {"paper": "#101312", "paper-2": "#151918", "ink": "#e7e9e3", "ink-strong": "#101312", "muted": "#9ba59f", "soft": "#87928c", "rule": "#303632", "rule-solid": "#4a524d", "accent": "#9cffcb", "accent-tint": "#1e2b24", "link": "#9cffcb"}}, "geometry": {"stroke-thin": 1.0, "stroke-default": 1.25, "stroke-strong": 1.75, "radius-sm": 4.0, "radius-md": 6.0, "radius-lg": 8.0, "grid": 4.0}, "fonts": {"title": "Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif", "node-name": "Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif", "sublabel": "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace", "eyebrow": "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace", "arrow-label": "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace", "callout": "Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"}, "typography": {"size-title": "32px", "weight-title": "680", "size-node-name": "18px", "weight-node-name": "620", "size-sublabel": "12px", "weight-sublabel": "400", "size-eyebrow": "11px", "weight-eyebrow": "500", "size-arrow-label": "11px", "weight-arrow-label": "400", "size-callout": "16px", "weight-callout": "400"}, "meta": {"name": "andrewmccall.com", "slug": "andrewmccall-site", "notes": "Site palette and type for diagrams published on andrewmccall.com; dark is primary"}, "svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"960\" height=\"600\" viewBox=\"0 0 960 600\" role=\"img\" aria-labelledby=\"title desc\"\u003e\n\u003ctitle id=\"title\"\u003eOne task. Three runtimes.\u003c/title\u003e\n\u003cdesc id=\"desc\"\u003eAn application submits a task to one interface, which selects Codex, Claude Code or Hermes and persists sessions and files. This is an illustrative architecture.\u003c/desc\u003e\n\u003cstyle\u003e\n  text { fill:var(--ink); font-family:var(--font-node-name); }\n  .headline { font-family:var(--font-title); font-size:var(--size-title); font-weight:var(--weight-title); }\n  .callout { font-family:var(--font-callout); font-size:var(--size-callout); font-weight:var(--weight-callout); fill:var(--muted); }\n  .name { font-size:var(--size-node-name); font-weight:var(--weight-node-name); }\n  .detail { font-family:var(--font-sublabel); font-size:var(--size-sublabel); font-weight:var(--weight-sublabel); fill:var(--muted); }\n  .eyebrow { font-family:var(--font-eyebrow); font-size:var(--size-eyebrow); font-weight:var(--weight-eyebrow); letter-spacing:1.5px; fill:var(--soft); }\n  .edge-label { font-family:var(--font-arrow-label); font-size:var(--size-arrow-label); font-weight:var(--weight-arrow-label); fill:var(--muted); }\n  .edge { fill:none; stroke:var(--muted); stroke-width:var(--stroke-default); marker-end:url(#arrow); }\n  .node { fill:var(--paper); stroke:var(--muted); stroke-width:var(--stroke-default); }\n\u003c/style\u003e\n\u003cdefs\u003e\u003cmarker id=\"arrow\" viewBox=\"0 0 8 8\" markerWidth=\"8\" markerHeight=\"8\" refX=\"8\" refY=\"4\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"\u003e\u003cpath d=\"M1,1 L7,4 L1,7\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n\u003crect width=\"960\" height=\"600\" fill=\"var(--paper)\"/\u003e\n\u003ctext class=\"eyebrow\" x=\"48\" y=\"44\"\u003eILLUSTRATIVE ARCHITECTURE\u003c/text\u003e\n\u003ctext class=\"headline\" x=\"48\" y=\"92\"\u003eOne task. Three runtimes.\u003c/text\u003e\n\u003ctext class=\"callout\" x=\"48\" y=\"124\"\u003eKeep the interface stable. Choose the runtime for the work.\u003c/text\u003e\n\u003crect x=\"664\" y=\"156\" width=\"248\" height=\"352\" rx=\"var(--radius-lg)\" fill=\"var(--paper-2)\" stroke=\"var(--rule-solid)\" stroke-width=\"var(--stroke-thin)\" stroke-dasharray=\"4 4\"/\u003e\n\u003ctext class=\"eyebrow\" x=\"688\" y=\"184\"\u003eEXECUTION\u003c/text\u003e\n\u003cpath class=\"edge\" d=\"M248,304 H352\"/\u003e\n\u003crect x=\"268\" y=\"268\" width=\"64\" height=\"20\" fill=\"var(--paper)\"/\u003e\n\u003ctext class=\"edge-label\" x=\"300\" y=\"284\" text-anchor=\"middle\"\u003eSUBMIT\u003c/text\u003e\n\u003cpath class=\"edge\" d=\"M560,280 H592 Q600,280 600,272 V248 Q600,240 608,240 H688\"/\u003e\n\u003cpath class=\"edge\" d=\"M560,304 H616 Q624,304 624,312 V336 Q624,344 632,344 H688\"/\u003e\n\u003cpath class=\"edge\" d=\"M560,328 H584 Q592,328 592,336 V440 Q592,448 600,448 H688\"/\u003e\n\u003cpath class=\"edge\" d=\"M460,360 V432\" stroke-dasharray=\"4 4\"/\u003e\n\u003crect x=\"476\" y=\"388\" width=\"72\" height=\"20\" fill=\"var(--paper)\"/\u003e\n\u003ctext class=\"edge-label\" x=\"484\" y=\"404\"\u003ePERSIST\u003c/text\u003e\n\u003crect class=\"node\" x=\"64\" y=\"256\" width=\"176\" height=\"96\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"152\" y=\"296\" text-anchor=\"middle\"\u003eApplication\u003c/text\u003e\n\u003ctext class=\"detail\" x=\"152\" y=\"324\" text-anchor=\"middle\"\u003eAPI client\u003c/text\u003e\n\u003crect x=\"360\" y=\"256\" width=\"200\" height=\"96\" rx=\"var(--radius-md)\" fill=\"var(--accent-tint)\" stroke=\"var(--accent)\" stroke-width=\"var(--stroke-strong)\"/\u003e\n\u003ctext class=\"name\" x=\"460\" y=\"296\" text-anchor=\"middle\" style=\"fill:var(--accent)\"\u003eTask interface\u003c/text\u003e\n\u003ctext class=\"detail\" x=\"460\" y=\"324\" text-anchor=\"middle\"\u003esubmit \u00b7 stream\u003c/text\u003e\n\u003crect class=\"node\" x=\"696\" y=\"208\" width=\"184\" height=\"64\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"788\" y=\"247\" text-anchor=\"middle\"\u003eCodex\u003c/text\u003e\n\u003crect class=\"node\" x=\"696\" y=\"312\" width=\"184\" height=\"64\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"788\" y=\"351\" text-anchor=\"middle\"\u003eClaude Code\u003c/text\u003e\n\u003crect class=\"node\" x=\"696\" y=\"416\" width=\"184\" height=\"64\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"788\" y=\"455\" text-anchor=\"middle\"\u003eHermes\u003c/text\u003e\n\u003crect x=\"360\" y=\"440\" width=\"200\" height=\"72\" rx=\"var(--radius-md)\" fill=\"var(--paper-2)\" stroke=\"var(--muted)\" stroke-width=\"var(--stroke-default)\"/\u003e\n\u003ctext class=\"name\" x=\"460\" y=\"472\" text-anchor=\"middle\"\u003eSessions + files\u003c/text\u003e\n\u003ctext class=\"detail\" x=\"460\" y=\"496\" text-anchor=\"middle\"\u003estate \u00b7 artifacts\u003c/text\u003e\n\u003cpath d=\"M48,552 H912\" stroke=\"var(--rule)\" stroke-width=\"1\"/\u003e\n\u003ctext class=\"callout\" x=\"48\" y=\"580\"\u003eOne focal point. Clear boundaries. Room to read.\u003c/text\u003e\n\u003c/svg\u003e\n"}</script>
<script>
(() => {
  const initial=JSON.parse(document.getElementById('style-data').textContent);
  let state=structuredClone(initial);
  const $=id=>document.getElementById(id);
  const template=initial.svg;
  const textRoles=['ink','muted','soft','accent','link'];
  const surfaces=['paper','paper-2','accent-tint'];
  function luminance(hex){const rgb=hex.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;}
  function ratio(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
  function failures(){const out=[];for(const mode of ['light','dark']){const p=state.palettes[mode];for(const role of textRoles)for(const bg of surfaces)if(ratio(p[role],p[bg])<4.5)out.push(`${mode}: ${role} on ${bg}`);if(ratio(p['ink-strong'],p.accent)<4.5)out.push(`${mode}: ink-strong on accent`);}return out;}
  function values(mode){return {...state.palettes[mode],...state.geometry,...state.typography,...Object.fromEntries(Object.entries(state.fonts).map(([k,v])=>['font-'+k,v]))};}
  function svg(mode){const v=values(mode);return template.replace(/var\(--([a-z0-9-]+)\)/g,(_,key)=>v[key]).replace(/id="([^"]+)"/g,(_,id)=>`id="${mode}-${id}"`).replace(/url\(#([^\)]+)\)/g,(_,id)=>`url(#${mode}-${id})`).replace('aria-labelledby="title desc"',`aria-labelledby="${mode}-title ${mode}-desc"`);}
  function profile(){return state.profile.split('\n').map(line=>{const cells=line.split('|').map(s=>s.trim());if(cells.length<4)return line;const role=cells[1].replaceAll('`','');if(role in state.palettes.light){cells[3]='`'+state.palettes.light[role]+'`';cells[4]='`'+state.palettes.dark[role]+'`';return cells.join(' | ').trim();}if(role in state.fonts){cells[2]=state.fonts[role];return cells.join(' | ').trim();}if(role in state.geometry){cells[2]='`'+state.geometry[role]+'`';return cells.join(' | ').trim();}return line;}).join('\n');}
  function render(){for(const mode of ['light','dark']){$(mode+'-canvas').innerHTML=svg(mode);$(mode+'-panel').hidden=!$('compare').checked&&$('palette').value!==mode;}$('radius-value').textContent=state.geometry['radius-md']+'px';$('profile-text').textContent=profile();const errors=failures();$('status').dataset.invalid=String(errors.length>0);$('status').textContent=errors.length?'Adjust colors before export. Contrast below 4.5:1: '+errors.join('; '):'Both palettes pass the profile text-contrast checks.';for(const id of ['save-profile','save-light','save-dark'])$(id).disabled=errors.length>0;}
  function sync(){for(const role of ['paper','accent','accent-tint'])$(role).value=state.palettes[$('palette').value][role];$('radius').value=state.geometry['radius-md'];$('headings').value=state.fonts.title.includes('Chalkboard')?'handwritten':'clean';}
  function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  for(const role of ['paper','accent','accent-tint'])$(role).addEventListener('input',()=>{state.palettes[$('palette').value][role]=$(role).value;render();});
  $('palette').addEventListener('change',()=>{sync();render();});$('compare').addEventListener('change',render);
  $('radius').addEventListener('input',()=>{state.geometry['radius-md']=Number($('radius').value);render();});
  $('headings').addEventListener('change',()=>{for(const role of ['title','callout'])state.fonts[role]=$('headings').value==='handwritten'?'Chalkboard, Comic Sans MS, cursive':initial.fonts[role];render();});
  $('reset').addEventListener('click',()=>{state=structuredClone(initial);sync();render();});
  $('save-profile').addEventListener('click',()=>download(initial.meta.slug+'.md',profile(),'text/markdown'));
  for(const mode of ['light','dark'])$('save-'+mode).addEventListener('click',()=>download('diagram-'+mode+'.svg',svg(mode),'image/svg+xml'));
  $('profile-name').textContent=initial.meta.name;$('profile-notes').textContent=initial.meta.notes?initial.meta.notes+'.':'';document.title=initial.meta.name+' · diagram styling';
  sync();render();
})();
</script></body></html>
