<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">One task. Three runtimes.</title>
<desc id="desc">An application submits a task to one interface, which selects Codex, Claude Code or Hermes and persists sessions and files. This is an illustrative architecture.</desc>
<style>
  text { fill:#17232e; font-family:Arial, Helvetica, sans-serif; }
  .headline { font-family:Arial, Helvetica, sans-serif; font-size:32px; font-weight:600; }
  .callout { font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:400; fill:#50606d; }
  .name { font-size:20px; font-weight:600; }
  .detail { font-family:ui-monospace, monospace; font-size:13px; font-weight:400; fill:#50606d; }
  .eyebrow { font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:600; letter-spacing:1.5px; fill:#596874; }
  .edge-label { font-family:ui-monospace, monospace; font-size:12px; font-weight:400; fill:#50606d; }
  .edge { fill:none; stroke:#50606d; stroke-width:1.5; marker-end:url(#arrow); }
  .node { fill:#f7f4eb; stroke:#50606d; stroke-width:1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#50606d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="600" fill="#f7f4eb"/>
<text class="eyebrow" x="48" y="44">ILLUSTRATIVE ARCHITECTURE</text>
<text class="headline" x="48" y="92">One task. Three runtimes.</text>
<text class="callout" x="48" y="124">Keep the interface stable. Choose the runtime for the work.</text>
<rect x="664" y="156" width="248" height="352" rx="8.0" fill="#eeece3" stroke="#b3b6b3" stroke-width="1.0" stroke-dasharray="4 4"/>
<text class="eyebrow" x="688" y="184">EXECUTION</text>
<path class="edge" d="M248,304 H352"/>
<rect x="268" y="268" width="64" height="20" fill="#f7f4eb"/>
<text class="edge-label" x="300" y="284" text-anchor="middle">SUBMIT</text>
<path class="edge" d="M560,280 H592 Q600,280 600,272 V248 Q600,240 608,240 H688"/>
<path class="edge" d="M560,304 H616 Q624,304 624,312 V336 Q624,344 632,344 H688"/>
<path class="edge" d="M560,328 H584 Q592,328 592,336 V440 Q592,448 600,448 H688"/>
<path class="edge" d="M460,360 V432" stroke-dasharray="4 4"/>
<rect x="476" y="388" width="72" height="20" fill="#f7f4eb"/>
<text class="edge-label" x="484" y="404">PERSIST</text>
<rect class="node" x="64" y="256" width="176" height="96" rx="6.0"/>
<text class="name" x="152" y="296" text-anchor="middle">Application</text>
<text class="detail" x="152" y="324" text-anchor="middle">API client</text>
<rect x="360" y="256" width="200" height="96" rx="6.0" fill="#e2edf2" stroke="#23618b" stroke-width="2.0"/>
<text class="name" x="460" y="296" text-anchor="middle" style="fill:#23618b">Task interface</text>
<text class="detail" x="460" y="324" text-anchor="middle">submit · stream</text>
<rect class="node" x="696" y="208" width="184" height="64" rx="6.0"/>
<text class="name" x="788" y="247" text-anchor="middle">Codex</text>
<rect class="node" x="696" y="312" width="184" height="64" rx="6.0"/>
<text class="name" x="788" y="351" text-anchor="middle">Claude Code</text>
<rect class="node" x="696" y="416" width="184" height="64" rx="6.0"/>
<text class="name" x="788" y="455" text-anchor="middle">Hermes</text>
<rect x="360" y="440" width="200" height="72" rx="6.0" fill="#eeece3" stroke="#50606d" stroke-width="1.5"/>
<text class="name" x="460" y="472" text-anchor="middle">Sessions + files</text>
<text class="detail" x="460" y="496" text-anchor="middle">state · artifacts</text>
<path d="M48,552 H912" stroke="#d8d5cc" stroke-width="1"/>
<text class="callout" x="48" y="580">One focal point. Clear boundaries. Room to read.</text>
</svg>
