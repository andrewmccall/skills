<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andrew Clean · diagram styling</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f2f2f0;color:#17232e;font:15px/1.5 Arial,Helvetica,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:28px;font-weight:600;margin:0 0 8px}p{margin:0 0 24px;color:#50606d}header{margin-bottom:24px}.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;padding:20px 0;border-top:1px solid #c9cdd0;border-bottom:1px solid #c9cdd0}label{display:flex;flex-direction:column;gap:6px;font-size:13px}input,select,button{font:inherit}input[type=color]{width:60px;height:36px;padding:3px;border:1px solid #89949e;border-radius:4px;background:transparent}input[type=range]{width:120px;min-height:32px}select,button{padding:8px 12px;border:1px solid #89949e;border-radius:4px;background:#fff;color:#17232e}button:disabled{opacity:.45}button{cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.check{flex-direction:row;align-items:center;padding-bottom:8px}section{margin:28px 0}h2{font-size:13px;letter-spacing:1.2px;font-weight:600}.canvas{overflow-x:auto}svg{display:block;width:100%;min-width:960px;height:auto}#status{min-height:24px;font-size:13px;margin:12px 0;color:#354b5e}#status[data-invalid=true]{color:#972c24}details{margin-top:24px}summary{cursor:pointer}pre{white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace}.note{font-size:13px}a{color:#23618b}:focus-visible{outline:3px solid #23618b;outline-offset:3px}@media(max-width:600px){body{padding:16px}.controls{gap:16px}button,select{min-height:44px}}
</style></head><body><main>
<header><h1>Andrew Clean</h1><p>Warm light. Quiet dark. The same diagram in both.</p></header>
<div class="controls">
<label>Palette<select id="palette"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label>Canvas<input id="paper" type="color" aria-label="Canvas color"></label>
<label>Accent<input id="accent" type="color" aria-label="Accent color"></label>
<label>Accent fill<input id="accent-tint" type="color" aria-label="Accent fill color"></label>
<label>Node corners <output id="radius-value">6px</output><input id="radius" type="range" min="0" max="8" step="1" value="6"></label>
<label>Headings<select id="headings"><option value="clean">Clean sans</option><option value="handwritten">Handwritten</option></select></label>
<label class="check"><input id="compare" type="checkbox" checked>Compare both</label>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div class="actions"><button id="save-profile" type="button">Save style profile</button><button id="save-light" type="button">Export light SVG</button><button id="save-dark" type="button">Export dark SVG</button><button id="reset" type="button">Reset</button></div>
<section id="light-panel"><h2>LIGHT</h2><div class="canvas" id="light-canvas"></div></section>
<section id="dark-panel"><h2>DARK</h2><div class="canvas" id="dark-canvas"></div></section>
<p class="note">Changes stay in this page until you save a profile. Handwritten headings use an installed system font, with a cursive fallback. This example illustrates task routing.</p>
<details><summary>Current profile</summary><pre id="profile-text"></pre></details>
</main>
<script id="style-data" type="application/json">{"profile": "\u003c!-- diagram-design-profile\nname: Andrew Clean\nslug: andrew-clean\nsource-url: https://x.com/akshay_pachaar/status/2100888166219886818\ncreated: 2026-11-04\nupdated: 2026-11-04\nnotes: Warm paper and restrained technical styling, paired light and dark themes\n--\u003e\n# Style Guide\n\nUse with Cathryn Lavery's `diagram-design`. This profile changes the visual skin;\nuse that skill's type references, complexity limits, connector routing and checks.\nThe profile is the authored source for the preview and both exports. Edit its\ntables, then run the bundled build script to regenerate the preview.\n\n## Tokens\n\n### Semantic roles\n\n| Role | Purpose | Light | Dark |\n|---|---|---|---|\n| `paper` | Canvas | `#f7f4eb` | `#111820` |\n| `paper-2` | Quiet grouping and secondary nodes | `#eeece3` | `#1b2530` |\n| `ink` | Primary text | `#17232e` | `#edf2f7` |\n| `ink-strong` | Text on opaque accent fill | `#ffffff` | `#111820` |\n| `muted` | Secondary text and essential connectors | `#50606d` | `#b7c4d1` |\n| `soft` | Small labels | `#596874` | `#a1b1c1` |\n| `rule` | Decorative dividers | `#d8d5cc` | `#354350` |\n| `rule-solid` | Decorative group boundaries | `#b3b6b3` | `#596d80` |\n| `accent` | One focal node or path | `#23618b` | `#91c8ec` |\n| `accent-tint` | Quiet focal fill | `#e2edf2` | `#203548` |\n| `link` | External call or protocol label | `#23618b` | `#91c8ec` |\n\n### Contrast contract\n\nText using `ink`, `muted`, `soft`, `link` or `accent` clears 4.5:1 against\n`paper`, `paper-2` and `accent-tint`. Essential connectors and node borders use\n`muted` or `accent` at full opacity and clear 3:1 against their adjacent surfaces.\n`ink-strong` is used only on an opaque `accent` fill. Decorative rules cannot be\nthe only way a reader identifies a boundary. Theme changes preserve topology,\nwording, role meanings and geometry. A dark theme has its own palette, not an\ninversion filter.\n\n## Typography\n\n| Role | Family | Size | Weight | Usage |\n|---|---|---|---|---|\n| `title` | Arial, Helvetica, sans-serif | 32px | 600 | Technical headline |\n| `node-name` | Arial, Helvetica, sans-serif | 20px | 600 | Component names |\n| `sublabel` | ui-monospace, monospace | 13px | 400 | API and storage details |\n| `eyebrow` | Arial, Helvetica, sans-serif | 12px | 600 | Zone and category labels |\n| `arrow-label` | ui-monospace, monospace | 12px | 400 | Short connector labels |\n| `callout` | Arial, Helvetica, sans-serif | 16px | 400 | One supporting sentence |\n\n### Font source\n\nFont source: `system`\n\nUse the listed system stacks and omit external font requests. This technical\nskin intentionally uses a sans headline instead of the upstream editorial serif.\nFor the handwritten option, change `title` and `callout` to\n`Chalkboard, Comic Sans MS, cursive`. Keep component names and technical details\nin their readable system stacks. Check the actual rendered font metrics before\nexporting. Font availability and fallback differ across machines.\n\n## Stroke, radius, spacing\n\n| Token | Value | Use |\n|---|---|---|\n| `stroke-thin` | `1` | Decorative boundaries |\n| `stroke-default` | `1.5` | Essential connectors and node borders |\n| `stroke-strong` | `2` | Focal outline |\n| `radius-sm` | `4` | Small labels |\n| `radius-md` | `6` | Nodes |\n| `radius-lg` | `8` | Groups |\n| `grid` | `4` | Structural geometry |\n\nRounded orthogonal connectors follow the upstream routing rules. Do not import\nBybit's curved-connector requirement into this profile. Keep 6\u201310px clear between\nan arrow label and its stroke. Give each connector a distinct attachment point.\nUse generous gutters and align related components to a shared axis.\n\n## Node type \u2192 treatment\n\n| Type | Fill | Stroke |\n|---|---|---|\n| `focal` | `accent-tint` | `accent`, stroke-strong |\n| `backend` | `paper` | `muted` |\n| `store` | `paper-2` | `muted` |\n| `external` | `paper` | `muted` |\n| `input` | `paper` | `muted` |\n| `optional` | `paper` | `muted`, dashed 4,4 |\n| `security` | `paper` | `muted`, dashed 4,4 and an explicit boundary label |\n\nReserve accent for one or two focal elements. Use labels and line treatment for\nmeaning rather than assigning every peer a different hue. Default to plain paper,\nwith no dots, gradients, shadows, glow or decorative icons. Dashed boundaries\ndenote a real grouping or scope, not a frame around the entire figure.\n\n## Customizing the skin\n\nEdit semantic roles to change color; edit typography and stroke tables to change\nthe visual treatment. Regenerate and inspect both modes after a change. The\npreview's controls can export an updated complete profile and standalone SVGs.\nKeep this profile outside an installed upstream skill so updates cannot replace\nit. For named-profile installation, follow the current upstream `profiles.md`\nprocedures. Honour a project's existing profile or explicit brand requirements.\n\n## Visual references\n\n- [Akshay Pachaar's article](https://x.com/akshay_pachaar/status/2100888166219886818): warm paper, approachable labels and simple relationships. The figure was inspected through a public article mirror because X did not load directly.\n- [Bybit SVG Diagram](https://github.com/bybit-exchange/svg-diagram): restrained fills, clear hierarchy, consistent spacing and readable technical diagrams.\n- [Diagram Design](https://github.com/cathrynlavery/diagram-design): retained diagram engine, type selection and layout checks.\n", "palettes": {"light": {"paper": "#f7f4eb", "paper-2": "#eeece3", "ink": "#17232e", "ink-strong": "#ffffff", "muted": "#50606d", "soft": "#596874", "rule": "#d8d5cc", "rule-solid": "#b3b6b3", "accent": "#23618b", "accent-tint": "#e2edf2", "link": "#23618b"}, "dark": {"paper": "#111820", "paper-2": "#1b2530", "ink": "#edf2f7", "ink-strong": "#111820", "muted": "#b7c4d1", "soft": "#a1b1c1", "rule": "#354350", "rule-solid": "#596d80", "accent": "#91c8ec", "accent-tint": "#203548", "link": "#91c8ec"}}, "geometry": {"stroke-thin": 1.0, "stroke-default": 1.5, "stroke-strong": 2.0, "radius-sm": 4.0, "radius-md": 6.0, "radius-lg": 8.0, "grid": 4.0}, "fonts": {"title": "Arial, Helvetica, sans-serif", "node-name": "Arial, Helvetica, sans-serif", "sublabel": "ui-monospace, monospace", "eyebrow": "Arial, Helvetica, sans-serif", "arrow-label": "ui-monospace, monospace", "callout": "Arial, Helvetica, sans-serif"}, "typography": {"size-title": "32px", "weight-title": "600", "size-node-name": "20px", "weight-node-name": "600", "size-sublabel": "13px", "weight-sublabel": "400", "size-eyebrow": "12px", "weight-eyebrow": "600", "size-arrow-label": "12px", "weight-arrow-label": "400", "size-callout": "16px", "weight-callout": "400"}, "svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"960\" height=\"600\" viewBox=\"0 0 960 600\" role=\"img\" aria-labelledby=\"title desc\"\u003e\n\u003ctitle id=\"title\"\u003eOne task. Three runtimes.\u003c/title\u003e\n\u003cdesc id=\"desc\"\u003eAn application submits a task to one interface, which selects Codex, Claude Code or Hermes and persists sessions and files. This is an illustrative architecture.\u003c/desc\u003e\n\u003cstyle\u003e\n  text { fill:var(--ink); font-family:var(--font-node-name); }\n  .headline { font-family:var(--font-title); font-size:var(--size-title); font-weight:var(--weight-title); }\n  .callout { font-family:var(--font-callout); font-size:var(--size-callout); font-weight:var(--weight-callout); fill:var(--muted); }\n  .name { font-size:var(--size-node-name); font-weight:var(--weight-node-name); }\n  .detail { font-family:var(--font-sublabel); font-size:var(--size-sublabel); font-weight:var(--weight-sublabel); fill:var(--muted); }\n  .eyebrow { font-family:var(--font-eyebrow); font-size:var(--size-eyebrow); font-weight:var(--weight-eyebrow); letter-spacing:1.5px; fill:var(--soft); }\n  .edge-label { font-family:var(--font-arrow-label); font-size:var(--size-arrow-label); font-weight:var(--weight-arrow-label); fill:var(--muted); }\n  .edge { fill:none; stroke:var(--muted); stroke-width:var(--stroke-default); marker-end:url(#arrow); }\n  .node { fill:var(--paper); stroke:var(--muted); stroke-width:var(--stroke-default); }\n\u003c/style\u003e\n\u003cdefs\u003e\u003cmarker id=\"arrow\" viewBox=\"0 0 8 8\" markerWidth=\"8\" markerHeight=\"8\" refX=\"8\" refY=\"4\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"\u003e\u003cpath d=\"M1,1 L7,4 L1,7\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n\u003crect width=\"960\" height=\"600\" fill=\"var(--paper)\"/\u003e\n\u003ctext class=\"eyebrow\" x=\"48\" y=\"44\"\u003eILLUSTRATIVE ARCHITECTURE\u003c/text\u003e\n\u003ctext class=\"headline\" x=\"48\" y=\"92\"\u003eOne task. Three runtimes.\u003c/text\u003e\n\u003ctext class=\"callout\" x=\"48\" y=\"124\"\u003eKeep the interface stable. Choose the runtime for the work.\u003c/text\u003e\n\u003crect x=\"664\" y=\"156\" width=\"248\" height=\"352\" rx=\"var(--radius-lg)\" fill=\"var(--paper-2)\" stroke=\"var(--rule-solid)\" stroke-width=\"var(--stroke-thin)\" stroke-dasharray=\"4 4\"/\u003e\n\u003ctext class=\"eyebrow\" x=\"688\" y=\"184\"\u003eEXECUTION\u003c/text\u003e\n\u003cpath class=\"edge\" d=\"M248,304 H352\"/\u003e\n\u003crect x=\"268\" y=\"268\" width=\"64\" height=\"20\" fill=\"var(--paper)\"/\u003e\n\u003ctext class=\"edge-label\" x=\"300\" y=\"284\" text-anchor=\"middle\"\u003eSUBMIT\u003c/text\u003e\n\u003cpath class=\"edge\" d=\"M560,280 H592 Q600,280 600,272 V248 Q600,240 608,240 H688\"/\u003e\n\u003cpath class=\"edge\" d=\"M560,304 H616 Q624,304 624,312 V336 Q624,344 632,344 H688\"/\u003e\n\u003cpath class=\"edge\" d=\"M560,328 H584 Q592,328 592,336 V440 Q592,448 600,448 H688\"/\u003e\n\u003cpath class=\"edge\" d=\"M460,360 V432\" stroke-dasharray=\"4 4\"/\u003e\n\u003crect x=\"476\" y=\"388\" width=\"72\" height=\"20\" fill=\"var(--paper)\"/\u003e\n\u003ctext class=\"edge-label\" x=\"484\" y=\"404\"\u003ePERSIST\u003c/text\u003e\n\u003crect class=\"node\" x=\"64\" y=\"256\" width=\"176\" height=\"96\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"152\" y=\"296\" text-anchor=\"middle\"\u003eApplication\u003c/text\u003e\n\u003ctext class=\"detail\" x=\"152\" y=\"324\" text-anchor=\"middle\"\u003eAPI client\u003c/text\u003e\n\u003crect x=\"360\" y=\"256\" width=\"200\" height=\"96\" rx=\"var(--radius-md)\" fill=\"var(--accent-tint)\" stroke=\"var(--accent)\" stroke-width=\"var(--stroke-strong)\"/\u003e\n\u003ctext class=\"name\" x=\"460\" y=\"296\" text-anchor=\"middle\" style=\"fill:var(--accent)\"\u003eTask interface\u003c/text\u003e\n\u003ctext class=\"detail\" x=\"460\" y=\"324\" text-anchor=\"middle\"\u003esubmit \u00b7 stream\u003c/text\u003e\n\u003crect class=\"node\" x=\"696\" y=\"208\" width=\"184\" height=\"64\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"788\" y=\"247\" text-anchor=\"middle\"\u003eCodex\u003c/text\u003e\n\u003crect class=\"node\" x=\"696\" y=\"312\" width=\"184\" height=\"64\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"788\" y=\"351\" text-anchor=\"middle\"\u003eClaude Code\u003c/text\u003e\n\u003crect class=\"node\" x=\"696\" y=\"416\" width=\"184\" height=\"64\" rx=\"var(--radius-md)\"/\u003e\n\u003ctext class=\"name\" x=\"788\" y=\"455\" text-anchor=\"middle\"\u003eHermes\u003c/text\u003e\n\u003crect x=\"360\" y=\"440\" width=\"200\" height=\"72\" rx=\"var(--radius-md)\" fill=\"var(--paper-2)\" stroke=\"var(--muted)\" stroke-width=\"var(--stroke-default)\"/\u003e\n\u003ctext class=\"name\" x=\"460\" y=\"472\" text-anchor=\"middle\"\u003eSessions + files\u003c/text\u003e\n\u003ctext class=\"detail\" x=\"460\" y=\"496\" text-anchor=\"middle\"\u003estate \u00b7 artifacts\u003c/text\u003e\n\u003cpath d=\"M48,552 H912\" stroke=\"var(--rule)\" stroke-width=\"1\"/\u003e\n\u003ctext class=\"callout\" x=\"48\" y=\"580\"\u003eOne focal point. Clear boundaries. Room to read.\u003c/text\u003e\n\u003c/svg\u003e\n"}</script>
<script>
(() => {
  const initial=JSON.parse(document.getElementById('style-data').textContent);
  let state=structuredClone(initial);
  const $=id=>document.getElementById(id);
  const template=initial.svg;
  const textRoles=['ink','muted','soft','accent','link'];
  const surfaces=['paper','paper-2','accent-tint'];
  function luminance(hex){const rgb=hex.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;}
  function ratio(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
  function failures(){const out=[];for(const mode of ['light','dark']){const p=state.palettes[mode];for(const role of textRoles)for(const bg of surfaces)if(ratio(p[role],p[bg])<4.5)out.push(`${mode}: ${role} on ${bg}`);if(ratio(p['ink-strong'],p.accent)<4.5)out.push(`${mode}: ink-strong on accent`);}return out;}
  function values(mode){return {...state.palettes[mode],...state.geometry,...state.typography,...Object.fromEntries(Object.entries(state.fonts).map(([k,v])=>['font-'+k,v]))};}
  function svg(mode){const v=values(mode);return template.replace(/var\(--([a-z0-9-]+)\)/g,(_,key)=>v[key]).replace(/id="([^"]+)"/g,(_,id)=>`id="${mode}-${id}"`).replace(/url\(#([^\)]+)\)/g,(_,id)=>`url(#${mode}-${id})`).replace('aria-labelledby="title desc"',`aria-labelledby="${mode}-title ${mode}-desc"`);}
  function profile(){return state.profile.split('\n').map(line=>{const cells=line.split('|').map(s=>s.trim());if(cells.length<4)return line;const role=cells[1].replaceAll('`','');if(role in state.palettes.light){cells[3]='`'+state.palettes.light[role]+'`';cells[4]='`'+state.palettes.dark[role]+'`';return cells.join(' | ').trim();}if(role in state.fonts){cells[2]=state.fonts[role];return cells.join(' | ').trim();}if(role in state.geometry){cells[2]='`'+state.geometry[role]+'`';return cells.join(' | ').trim();}return line;}).join('\n');}
  function render(){for(const mode of ['light','dark']){$(mode+'-canvas').innerHTML=svg(mode);$(mode+'-panel').hidden=!$('compare').checked&&$('palette').value!==mode;}$('radius-value').textContent=state.geometry['radius-md']+'px';$('profile-text').textContent=profile();const errors=failures();$('status').dataset.invalid=String(errors.length>0);$('status').textContent=errors.length?'Adjust colors before export. Contrast below 4.5:1: '+errors.join('; '):'Both palettes pass the profile text-contrast checks.';for(const id of ['save-profile','save-light','save-dark'])$(id).disabled=errors.length>0;}
  function sync(){for(const role of ['paper','accent','accent-tint'])$(role).value=state.palettes[$('palette').value][role];$('radius').value=state.geometry['radius-md'];$('headings').value=state.fonts.title.includes('Chalkboard')?'handwritten':'clean';}
  function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  for(const role of ['paper','accent','accent-tint'])$(role).addEventListener('input',()=>{state.palettes[$('palette').value][role]=$(role).value;render();});
  $('palette').addEventListener('change',()=>{sync();render();});$('compare').addEventListener('change',render);
  $('radius').addEventListener('input',()=>{state.geometry['radius-md']=Number($('radius').value);render();});
  $('headings').addEventListener('change',()=>{for(const role of ['title','callout'])state.fonts[role]=$('headings').value==='handwritten'?'Chalkboard, Comic Sans MS, cursive':initial.fonts[role];render();});
  $('reset').addEventListener('click',()=>{state=structuredClone(initial);sync();render();});
  $('save-profile').addEventListener('click',()=>download('andrew-clean.md',profile(),'text/markdown'));
  for(const mode of ['light','dark'])$('save-'+mode).addEventListener('click',()=>download('diagram-'+mode+'.svg',svg(mode),'image/svg+xml'));
  sync();render();
})();
</script></body></html>
